[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-to-youtube-local"
version = "0.2.0"
description = "Local, resumable Spotify liked-songs to private YouTube playlist transfer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2", "spotipy>=2.24,<3"]

[project.scripts]
spotify-to-youtube = "spotify_to_youtube:main"

[tool.setuptools]
py-modules = ["spotify_to_youtube"]
